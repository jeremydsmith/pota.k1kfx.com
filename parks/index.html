<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>POTA Rare Parks</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <h1>POTA Rare Parks</h1>
  <p class="updated">
    <span id="updated">Loading data…</span>
    <a id="actionsLink" href="#" target="_blank" rel="noopener" hidden>Refresh via GitHub Actions</a>
  </p>
  <a class="back" href="../">← K1KFX Parks on the Air</a>
</header>

<main class="layout">
  <div id="map" aria-label="Map of parks"></div>

  <aside id="panel">
    <details id="filters" class="filters">
      <summary>Filters and settings</summary>

      <label class="slider">
        <span>Max distance from home: <b id="distVal"></b> mi</span>
        <input type="range" id="dist" min="25" max="600" step="25" value="200">
      </label>
      <label class="slider">
        <span>Max activations: <b id="actVal"></b></span>
        <input type="range" id="act" min="0" max="16" step="1" value="9">
      </label>

      <input type="search" id="search" placeholder="Search name or reference" aria-label="Search by name or reference">

      <fieldset>
        <legend>States &amp; provinces <span id="statesCount"></span></legend>
        <div id="states" class="chips"></div>
        <div class="chip-actions">
          <button type="button" id="statesAll">All</button>
          <button type="button" id="statesNone">None</button>
        </div>
      </fieldset>

      <label class="row">Park type
        <select id="type"><option value="">All types</option></select>
      </label>

      <label class="check"><input type="checkbox" id="hideMine"> Hide parks I've already activated</label>
      <label class="check"><input type="checkbox" id="easyOnly"> Only parks with no warnings in the notes</label>

      <div class="legend" aria-label="Legend">
        <span><i class="dot c0">2</i> 0–3</span>
        <span><i class="dot c1">5</i> 4–5</span>
        <span><i class="dot c2">7</i> 6–8</span>
        <span><i class="dot c3">10</i> 9–12</span>
        <span><i class="dot c4">20</i> 13+</span>
        <span><i class="dot c4 mine">1</i> mine</span>
      </div>

      <div class="buttons">
        <button type="button" id="exportCsv">Export CSV</button>
        <button type="button" id="exportGpx">Export GPX</button>
      </div>

      <fieldset>
        <legend>My activations (stays in this browser)</legend>
        <div class="buttons">
          <button type="button" id="loadCsv">Load my CSV</button>
          <button type="button" id="clearMine">Clear</button>
          <input type="file" id="csvFile" accept=".csv,text/csv" multiple hidden>
        </div>
        <p id="mineStatus" class="hint"></p>
      </fieldset>

      <fieldset>
        <legend>Home</legend>
        <div class="home">
          <label>Lat <input type="number" id="homeLat" step="0.0001" min="-90" max="90"></label>
          <label>Lon <input type="number" id="homeLon" step="0.0001" min="-180" max="180"></label>
        </div>
        <div class="buttons">
          <button type="button" id="homeSet">Set</button>
          <button type="button" id="homeLocate">Use my location</button>
          <button type="button" id="homeReset">Reset</button>
        </div>
        <p class="hint">You can also drag the home marker on the map.</p>
      </fieldset>
    </details>

    <p id="count" class="count" aria-live="polite"></p>

    <div class="tablewrap">
      <table id="list">
        <thead>
          <tr>
            <th data-sort="activations" class="num" title="Activations">Act</th>
            <th data-sort="name">Park</th>
            <th data-sort="state">State</th>
            <th data-sort="distance" class="num" title="Miles from home">Mi</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
<script src="js/app.js"></script>
</body>
</html>
